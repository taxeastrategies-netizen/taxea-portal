<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="robots" content="noindex,nofollow"/><title>Taxea · Prueba local del escáner</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import MobileScanner from '/src/components/lector/MobileScanner.jsx';
import '/src/index.css';
function TestScanner() {
  const [open, setOpen] = React.useState(true), [files, setFiles] = React.useState([]);
  return React.createElement('main', { style: { padding: 24, fontFamily: 'sans-serif' } },
    React.createElement('h1', null, 'Prueba del escáner · sin subida ni OCR'),
    React.createElement('p', null, 'Esta pantalla no llama a Base44 ni guarda documentos. Solo permite revisar JPEG generados en memoria.'),
    React.createElement('button', { onClick: () => setOpen(true) }, 'Abrir escáner de prueba'),
    files.map((file, index) => React.createElement('section', { key: file.url },
      React.createElement('p', null, `${index + 1}. ${file.name} · ${file.size} bytes · ${file.type}`),
      React.createElement('img', { src: file.url, alt: `JPEG de prueba ${index + 1}`, style: { maxWidth: '100%', maxHeight: 800 } }))),
    open && React.createElement(MobileScanner, { onClose: () => setOpen(false), onCapture: async result => { setFiles(previous => { previous.forEach(file => URL.revokeObjectURL(file.url)); return result.map(file => ({ name: file.name, size: file.size, type: file.type, url: URL.createObjectURL(file) })); }); } }));
}
createRoot(document.getElementById('root')).render(React.createElement(TestScanner));
</script></body></html>
